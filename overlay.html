<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADSCR Bilhar - Overlay OBS</title>
  <style>
    :root {
      --bg: rgba(14, 14, 16, 0.92);
      --bg-soft: rgba(27, 27, 31, 0.82);
      --panel: rgba(20, 20, 23, 0.9);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f7f7f5;
      --muted: rgba(255, 255, 255, 0.7);
      --accent: #d7d9df;
      --team-accent-home: #f2f2f2;
      --team-accent-away: #d3a11d;
      --metal-1: #6e747b;
      --metal-2: #2e3339;
      --metal-3: #a4aab0;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.34);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --team-width: minmax(250px, 1fr);
      --score-width: clamp(140px, 16vw, 190px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      color: var(--text);
      font-family: "Bahnschrift Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .overlay {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 16px 24px 136px;
      gap: 14px;
      position: relative;
      isolation: isolate;
    }

    .overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.1), transparent 28%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 36%);
      pointer-events: none;
      z-index: -2;
    }

    .overlay::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 14px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.12));
      pointer-events: none;
      z-index: -1;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: var(--team-width) var(--score-width) var(--team-width);
      align-items: stretch;
      gap: 10px;
    }

    .team-panel,
    .score-panel,
    .table-card,
    .brand-chip {
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow);
    }

    .team-panel {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02) 16%, rgba(0, 0, 0, 0.22) 17%, transparent 18%),
        linear-gradient(180deg, #2d3339, #101318 54%, #2a2f35);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .team-panel::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      pointer-events: none;
    }

    .team-panel::after {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      width: 5px;
      border-radius: 999px;
      background: var(--team-accent-home);
      box-shadow: 0 0 10px color-mix(in srgb, var(--team-accent-home) 55%, transparent);
    }

    .team-panel.away {
      flex-direction: row-reverse;
      text-align: right;
    }

    .team-panel.home::after {
      right: 10px;
    }

    .team-panel.away::after {
      left: 10px;
      background: var(--team-accent-away);
      box-shadow: 0 0 10px color-mix(in srgb, var(--team-accent-away) 55%, transparent);
    }

    .team-logo-wrap {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      pointer-events: none;
    }

    .team-panel.home .team-logo-wrap {
      left: 2px;
    }

    .team-panel.away .team-logo-wrap {
      right: 2px;
    }

    .team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    .team-meta {
      min-width: 0;
      display: grid;
      gap: 6px;
      width: 100%;
    }

    .team-panel.home .team-meta {
      padding-left: 62px;
      padding-right: 20px;
    }

    .team-panel.away .team-meta {
      padding-right: 62px;
      padding-left: 20px;
    }

    .team-label {
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
    }

    .team-name {
      font-size: clamp(18px, 1.55vw, 28px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.75);
    }

    .score-panel {
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.02) 16%, rgba(0, 0, 0, 0.22) 17%, transparent 18%),
        linear-gradient(180deg, #383f46, #101318 55%, #31373d);
      display: grid;
      place-items: center;
      padding: 6px 10px 8px;
      position: relative;
      overflow: hidden;
      clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
    }

    .score-panel::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      pointer-events: none;
      clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
    }

    .score-label {
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.75);
    }

    .score-value {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      font-size: clamp(30px, 2.8vw, 46px);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.75);
    }

    .score-dash {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.5em;
    }

    .score-pill {
      min-width: 0.98em;
      min-height: 1.08em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(235, 235, 235, 0.92));
      color: #050608;
      line-height: 1;
      text-shadow: none;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }

    .middle-space {
      position: relative;
    }

    .brand-chip {
      justify-self: center;
      align-self: center;
      background: linear-gradient(180deg, rgba(99, 105, 113, 0.9), rgba(21, 24, 29, 0.96));
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-chip img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
      filter: grayscale(1);
    }

    .tables {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-self: end;
    }

    .table-card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03) 16%, rgba(0, 0, 0, 0.22) 17%, transparent 18%),
        linear-gradient(180deg, #31363d, #0f1217 56%, #2e3339);
      border-radius: 8px;
      padding: 12px 16px 12px;
      display: grid;
      gap: 8px;
      align-content: start;
      position: relative;
      overflow: hidden;
    }

    .table-card::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      pointer-events: none;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .table-title {
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.75);
    }

    .table-score {
      font-size: 13px;
      font-weight: 800;
      color: #0a0b0d;
      padding: 3px 8px;
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(235, 235, 235, 0.92));
      min-width: 60px;
      text-align: center;
      visibility: hidden;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.75);
    }

    .table-score.visible {
      visibility: visible;
    }

    .players {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .table-card.idle .players {
      grid-template-columns: 1fr;
    }

    .player-name {
      font-size: clamp(17px, 1.35vw, 24px);
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      position: relative;
      padding-bottom: 6px;
      padding-left: 6px;
      padding-right: 6px;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
    }

    .player-name::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 0;
      height: 4px;
      border-radius: 999px;
      background: var(--team-accent-home);
      box-shadow: 0 0 10px color-mix(in srgb, var(--team-accent-home) 55%, transparent);
    }

    .player-name.away {
      text-align: right;
    }

    .player-name.away::after {
      background: var(--team-accent-away);
      box-shadow: 0 0 10px color-mix(in srgb, var(--team-accent-away) 55%, transparent);
    }

    .vs-badge {
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.96);
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      border: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02) 16%, rgba(0, 0, 0, 0.2) 17%, transparent 18%),
        linear-gradient(180deg, #2f343a, #0d1015 56%, #2d3238);
      clip-path: polygon(18% 0%, 82% 0%, 100% 100%, 0% 100%);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
    }

    .idle-copy {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-align: center;
      padding: 8px 6px 4px;
    }

    .layout-scoreboard .tables,
    .layout-scoreboard .brand-chip {
      display: none;
    }

    .layout-tables .scoreboard,
    .layout-tables .brand-chip {
      display: none;
    }

    .layout-single .brand-chip {
      display: none;
    }

    .layout-single .tables {
      grid-template-columns: 1fr;
      max-width: min(960px, 100%);
      justify-self: center;
      width: 100%;
    }

    .layout-single .table-card.hidden {
      display: none;
    }

    .layout-single .player-name {
      font-size: clamp(18px, 1.5vw, 24px);
    }

    .layout-tables .overlay {
      grid-template-rows: 1fr auto;
    }

    .layout-scoreboard .overlay {
      grid-template-rows: auto 1fr;
    }

    .layout-auto.auto-scoreboard .tables,
    .layout-auto.auto-scoreboard .brand-chip {
      display: none;
    }

    .layout-auto.auto-single .brand-chip {
      display: none;
    }

    .layout-auto.auto-single .tables {
      grid-template-columns: 1fr;
      max-width: min(960px, 100%);
      justify-self: center;
      width: 100%;
    }

    .layout-auto.auto-single .table-card.hidden {
      display: none;
    }

    .layout-auto.auto-single .table-card {
      min-height: 130px;
    }

    .layout-auto.auto-single .player-name {
      font-size: clamp(18px, 1.5vw, 24px);
    }

    @media (max-width: 1200px) {
      .scoreboard {
        grid-template-columns: 1fr;
      }

      .score-panel {
        min-height: 96px;
      }

      .tables {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .overlay {
        padding-bottom: 108px;
      }
    }
  </style>
</head>
<body class="layout-auto auto-two">
  <main class="overlay">
    <section class="scoreboard" aria-label="Marcador">
      <article class="team-panel home">
        <div class="team-logo-wrap">
          <img class="team-logo" id="homeLogo" src="logo.png" alt="Logotipo equipa casa" />
        </div>
        <div class="team-meta">
          <div class="team-label">Casa</div>
          <div class="team-name" id="homeName">Locais</div>
        </div>
      </article>

      <article class="score-panel">
        <div class="score-label" id="scoreLabel">Resultado</div>
        <div class="score-value">
          <span class="score-pill" id="homeScore">0</span>
          <span class="score-dash">-</span>
          <span class="score-pill" id="awayScore">0</span>
        </div>
      </article>

      <article class="team-panel away">
        <div class="team-logo-wrap">
          <img class="team-logo" id="awayLogo" src="logo.png" alt="Logotipo equipa visitante" />
        </div>
        <div class="team-meta">
          <div class="team-label">Visitante</div>
          <div class="team-name" id="awayName">Visitantes</div>
        </div>
      </article>
    </section>

    <section class="tables" aria-label="Mesas">
      <article class="table-card" id="table1Card">
        <header class="table-header">
          <div class="table-title">Mesa 1</div>
          <div class="table-score" id="table1Score"></div>
        </header>
        <div class="players" id="table1Players">
          <div class="player-name home" id="table1Home">Jogador 1</div>
          <div class="vs-badge">VS</div>
          <div class="player-name away" id="table1Away">Jogador 2</div>
        </div>
      </article>

      <article class="table-card" id="table2Card">
        <header class="table-header">
          <div class="table-title">Mesa 2</div>
          <div class="table-score" id="table2Score"></div>
        </header>
        <div class="players" id="table2Players">
          <div class="player-name home" id="table2Home">Jogador 1</div>
          <div class="vs-badge">VS</div>
          <div class="player-name away" id="table2Away">Jogador 2</div>
        </div>
      </article>
    </section>

  </main>

  <script>
    const REFRESH_MS = 1500;
    const AUTO_LAYOUT_TO_SINGLE_MS = 10000;
    const AUTO_LAYOUT_TO_SPLIT_MS = 5000;
    const DEFAULT_LOGO = "logo.png";
    let lastSignature = "";
    let overlayConfig = { layout: "auto", table: "1" };
    let autoDisplay = { mode: null, table: "1" };
    let autoPending = null;
    let autoPendingTimer = null;
    let latestAutoTables = null;

    function text(value, fallback) {
      return String(value || "").trim() || fallback;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function trimLabel(value, maxLength) {
      const normalized = String(value || "").replace(/\s+/g, " ").trim();
      if (normalized.length <= maxLength) return normalized;
      return `${normalized.slice(0, Math.max(0, maxLength - 1)).trimEnd()}…`;
    }

    function setLayout() {
      const params = new URLSearchParams(window.location.search);
      const layout = (params.get("layout") || "auto").toLowerCase();
      const table = params.get("table") === "2" ? "2" : "1";
      overlayConfig = { layout, table };
      document.body.classList.remove(
        "layout-auto",
        "layout-full",
        "layout-scoreboard",
        "layout-tables",
        "layout-single",
        "auto-two",
        "auto-single",
        "auto-scoreboard"
      );
      if (layout === "scoreboard" || layout === "tables" || layout === "single") {
        document.body.classList.add(`layout-${layout}`);
      } else if (layout === "full") {
        document.body.classList.add("layout-full");
      } else {
        document.body.classList.add("layout-auto", "auto-two");
      }

      document.getElementById("table1Card").classList.toggle("hidden", layout === "single" && table !== "1");
      document.getElementById("table2Card").classList.toggle("hidden", layout === "single" && table !== "2");
    }

    function buildLogoPath(viewMode, side, version) {
      const folder = viewMode === "open" ? "modo_open" : "competicao";
      return `obs_files/${folder}/logo_equipa_${side}.png?v=${version}`;
    }

    function updateLogo(img, path) {
      img.onerror = () => {
        img.onerror = null;
        img.src = DEFAULT_LOGO;
      };
      img.src = path;
    }

    function setTeamAccent(side, color) {
      document.documentElement.style.setProperty(`--team-accent-${side}`, color);
    }

    function rgbToCss(r, g, b) {
      return `rgb(${r}, ${g}, ${b})`;
    }

    function extractAccentFromLogo(side, path, fallbackColor) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const size = 24;
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        if (!context) {
          setTeamAccent(side, fallbackColor);
          return;
        }

        context.drawImage(img, 0, 0, size, size);
        const { data } = context.getImageData(0, 0, size, size);
        let totalR = 0;
        let totalG = 0;
        let totalB = 0;
        let count = 0;

        for (let i = 0; i < data.length; i += 16) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3];
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const saturation = max - min;
          const luminance = (r + g + b) / 3;

          if (a < 120) continue;
          if (luminance > 240 || luminance < 30) continue;
          if (saturation < 18) continue;

          totalR += r;
          totalG += g;
          totalB += b;
          count += 1;
        }

        if (!count) {
          setTeamAccent(side, fallbackColor);
          return;
        }

        setTeamAccent(
          side,
          rgbToCss(
            Math.round(totalR / count),
            Math.round(totalG / count),
            Math.round(totalB / count)
          )
        );
      };

      img.onerror = () => {
        setTeamAccent(side, fallbackColor);
      };
      img.src = path;
    }

    function renderTable(tableId, table, isOpenMode) {
      const hasGame = Boolean(table && table.gameId);
      const card = document.getElementById(`table${tableId}Card`);
      const players = document.getElementById(`table${tableId}Players`);
      const score = document.getElementById(`table${tableId}Score`);

      card.classList.toggle("idle", !hasGame);

      if (!hasGame) {
        players.innerHTML = '<div class="idle-copy">Mesa livre</div>';
        score.classList.remove("visible");
        score.textContent = "";
        return;
      }

      players.innerHTML = `
        <div class="player-name home">${escapeHtml(trimLabel(text(table.playerHome, "Jogador 1"), 28))}</div>
        <div class="vs-badge">VS</div>
        <div class="player-name away">${escapeHtml(trimLabel(text(table.playerAway, "Jogador 2"), 28))}</div>
      `;

      if (isOpenMode) {
        score.textContent = `${Number(table.scoreHome || 0)} - ${Number(table.scoreAway || 0)}`;
        score.classList.add("visible");
      } else {
        score.textContent = "";
        score.classList.remove("visible");
      }
    }

    function getActiveTableIds(tables) {
      return ["1", "2"].filter(tableId => Boolean(tables?.[tableId]?.gameId));
    }

    function getRawAutoLayout(tables) {
      const activeTableIds = getActiveTableIds(tables);
      if (activeTableIds.length >= 2) {
        return { mode: "two", table: overlayConfig.table };
      }
      if (activeTableIds.length === 1) {
        return { mode: "single", table: activeTableIds[0] };
      }
      return { mode: "scoreboard", table: overlayConfig.table };
    }

    function requiresDelayedAutoTransition(fromMode, toMode) {
      return (
        (fromMode === "two" && toMode === "single") ||
        (fromMode === "single" && toMode === "two")
      );
    }

    function getAutoTransitionDelay(fromMode, toMode) {
      if (fromMode === "two" && toMode === "single") {
        return AUTO_LAYOUT_TO_SINGLE_MS;
      }
      if (fromMode === "single" && toMode === "two") {
        return AUTO_LAYOUT_TO_SPLIT_MS;
      }
      return 0;
    }

    function clearPendingAutoTransition() {
      if (autoPendingTimer) {
        clearTimeout(autoPendingTimer);
        autoPendingTimer = null;
      }
      autoPending = null;
    }

    function applyDisplayedAutoLayout() {
      const mode = autoDisplay.mode || "two";
      const singleTableId = autoDisplay.table || overlayConfig.table;

      document.body.classList.remove("auto-two", "auto-single", "auto-scoreboard");
      document.body.classList.add(`auto-${mode}`);

      document.getElementById("table1Card").classList.toggle("hidden", mode === "single" && singleTableId !== "1");
      document.getElementById("table2Card").classList.toggle("hidden", mode === "single" && singleTableId !== "2");
    }

    function schedulePendingAutoTransition(target, delayMs) {
      if (
        autoPending &&
        autoPending.mode === target.mode &&
        autoPending.table === target.table &&
        autoPendingTimer
      ) {
        return;
      }

      clearPendingAutoTransition();
      autoPending = target;
      autoPendingTimer = setTimeout(() => {
        autoPendingTimer = null;
        autoPending = null;
        autoDisplay = getRawAutoLayout(latestAutoTables || {});
        applyDisplayedAutoLayout();
      }, delayMs);
    }

    function applyAutoLayout(tables) {
      if (overlayConfig.layout !== "auto") {
        return;
      }

      latestAutoTables = tables;
      const raw = getRawAutoLayout(tables);

      if (!autoDisplay.mode) {
        autoDisplay = raw;
        clearPendingAutoTransition();
        applyDisplayedAutoLayout();
        return;
      }

      if (raw.mode === autoDisplay.mode && raw.table === autoDisplay.table) {
        clearPendingAutoTransition();
        applyDisplayedAutoLayout();
        return;
      }

      if (requiresDelayedAutoTransition(autoDisplay.mode, raw.mode)) {
        schedulePendingAutoTransition(raw, getAutoTransitionDelay(autoDisplay.mode, raw.mode));
        applyDisplayedAutoLayout();
        return;
      }

      clearPendingAutoTransition();
      autoDisplay = raw;
      applyDisplayedAutoLayout();
    }

    function renderState(state) {
      const viewMode = state.viewMode === "open" ? "open" : "competicao";
      const home = state.teams?.home || {};
      const away = state.teams?.away || {};
      const tables = state.tables || {};
      const signature = JSON.stringify({
        viewMode,
        homeName: home.name,
        awayName: away.name,
        homeScore: home.score,
        awayScore: away.score,
        table1: tables["1"],
        table2: tables["2"]
      });

      if (signature === lastSignature) {
        return;
      }
      lastSignature = signature;

      document.getElementById("homeName").textContent = trimLabel(text(home.name, "Locais"), 34);
      document.getElementById("awayName").textContent = trimLabel(text(away.name, "Visitantes"), 34);
      document.getElementById("homeScore").textContent = Number(home.score || 0);
      document.getElementById("awayScore").textContent = Number(away.score || 0);
      document.getElementById("scoreLabel").textContent = viewMode === "open" ? "Classificacao" : "Resultado";

      const version = encodeURIComponent(`${Date.now()}-${home.name || ""}-${away.name || ""}`);
      const homeLogoPath = buildLogoPath(viewMode, "casa", version);
      const awayLogoPath = buildLogoPath(viewMode, "visitante", version);
      updateLogo(document.getElementById("homeLogo"), homeLogoPath);
      updateLogo(document.getElementById("awayLogo"), awayLogoPath);
      if (home.accentColor) {
        setTeamAccent("home", home.accentColor);
      } else {
        extractAccentFromLogo("home", homeLogoPath, "#f2f2f2");
      }
      if (away.accentColor) {
        setTeamAccent("away", away.accentColor);
      } else {
        extractAccentFromLogo("away", awayLogoPath, "#d3a11d");
      }

      renderTable("1", tables["1"], viewMode === "open");
      renderTable("2", tables["2"], viewMode === "open");
      applyAutoLayout(tables);
    }

    async function refresh() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        renderState(await response.json());
      } catch {
        lastSignature = "";
      }
    }

    setLayout();
    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
